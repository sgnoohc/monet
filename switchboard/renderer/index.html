<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; media-src https:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Switchboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside id="sidebar">
    <div class="drag"></div>
    <div class="search"><input id="search" type="search" placeholder="Search  ⌘K" spellcheck="false"><button id="edit-btn" class="link-btn edit-btn" title="Choose which chats appear">Edit</button></div>
    <div id="filters" class="filters"></div>
    <div id="edit-bar" class="edit-bar" hidden></div>
    <div id="apps" class="apps"></div>
    <div id="convs" class="convs"></div>
    <footer class="sidebar-footer">
      <div id="statuses" class="statuses"></div>
      <button id="flat-btn" class="icon-btn" title="Latest first: one list, newest message at the top (Ctrl+L)" aria-label="Latest first">◷</button>
      <button id="compact-btn" class="icon-btn" title="Compact view" aria-label="Compact view">☰</button>
      <button id="settings-btn" class="icon-btn" title="Settings (⌘,)" aria-label="Settings">⚙︎</button>
    </footer>
  </aside>

  <main id="main">
    <section id="empty-pane" class="pane">
      <div class="drag-bar"></div>
      <div class="empty">
        <div class="empty-mark">◎</div>
        <p>Pick a conversation on the left.</p>
      </div>
    </section>

    <section id="chat-pane" class="pane" hidden>
      <header id="chat-header" class="chat-header"></header>
      <div id="messages" class="messages"></div>
      <div id="gif-panel" class="gif-panel" hidden></div>
      <form id="composer" class="composer">
        <button type="button" id="gif-btn" class="gif-btn" title="Send a GIF">GIF</button>
        <textarea id="composer-input" rows="1" placeholder="Message" spellcheck="true"></textarea>
        <button type="submit" class="send-btn" aria-label="Send">↑</button>
      </form>
    </section>

    <section id="web-pane" class="pane" hidden>
      <div id="web-bar" class="drag-bar web-bar"></div>
      <div id="webapps" class="webapps"></div>
    </section>
  </main>

  <div id="settings" class="modal" hidden>
    <div class="dialog" role="dialog" aria-label="Settings"></div>
  </div>
  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
