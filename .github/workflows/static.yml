# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Assemble site
        # spaceattack stays at the site root; other web apps get their own path
        run: |
          mkdir -p _site/buzzer _site/physics_simulation _site/nbody_simulation _site/cms_event_display
          cp -R spaceattack/. _site/
          cp -R buzzer/index.html buzzer/audio _site/buzzer/
          cp physics_simulation/*.html _site/physics_simulation/
          # old links from before the move
          echo '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=../physics_simulation/nbody.html"><a href="../physics_simulation/nbody.html">Moved</a>' > _site/nbody_simulation/index.html
          echo '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=../physics_simulation/rigid_body.html"><a href="../physics_simulation/rigid_body.html">Moved</a>' > _site/nbody_simulation/rigid_body.html
          cp -R cms_event_display/index.html cms_event_display/cms_parts.js cms_event_display/events _site/cms_event_display/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
