[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "redpen"
dynamic = ["version"]
description = "Define answer zones on a quiz, split bulk scans by student, grade in the browser — entirely on your own machine."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["Pillow>=9", "numpy>=1.21"]

[project.scripts]
redpen = "redpen.cli:main"

[tool.setuptools]
packages = ["redpen"]

# One source for the version: redpen/__init__.py.  Package metadata is
# not carried into the frozen app, so the attribute is what both the
# CLI and mac/build_app.sh read.
[tool.setuptools.dynamic]
version = { attr = "redpen.__version__" }

[tool.setuptools.package-data]
redpen = ["vision/*.swift"]
